server {
    listen 80;

    # 1. Serve các file tĩnh của giao diện React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # Hỗ trợ React Router không bị lỗi 404 khi reload
    }

    # 2. Điều hướng toàn bộ request API sang API Gateway nội bộ của Docker
    location /api/ {
        proxy_pass http://api-gateway:8080; # Tên dịch vụ định nghĩa trong docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}